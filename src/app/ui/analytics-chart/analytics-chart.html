<div class="chart-container">

<h2>
Enrollment Analytics
</h2>


<div class="chart-bars">

<div 
class="bar approved"
[style.height.px]="approvedHeight()">

Approved

</div>


<div 
class="bar pending"
[style.height.px]="pendingHeight()">

Pending

</div>


<div 
class="bar rejected"
[style.height.px]="rejectedHeight()">

Rejected

</div>


</div>


<p>
Total records:
{{data().length}}
</p>


</div>
