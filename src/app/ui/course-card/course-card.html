<div
  class="bg-white/10 backdrop-blur-lg
         border border-white/20
         rounded-2xl
         p-6
         shadow-xl
         hover:scale-105
         transition
         duration-300">


  <!-- Course Title -->
  <h3 class="text-2xl font-bold text-white mb-4">
    {{ course().title }}
  </h3>


  <!-- Course Details -->
  <div class="space-y-3 text-gray-200">


    <p>
      <span class="font-semibold text-indigo-300">
        Code:
      </span>
      {{ course().code }}
    </p>


    <p>
      <span class="font-semibold text-indigo-300">
        Description:
      </span>
      {{ course().description }}
    </p>


    <p>
      <span class="font-semibold text-indigo-300">
        Maximum Capacity:
      </span>
      {{ course().maxCapacity }}
    </p>


  </div>


  <!-- Action Button -->
  <button
    (click)="enroll()"
    class="mt-6 w-full
           bg-indigo-600
           hover:bg-indigo-700
           text-white
           font-semibold
           py-3
           rounded-xl
           transition
           duration-300">

    Register Course

  </button>


</div>
