<div class="card">

  <h3>
    <a
      [routerLink]="['/courses', course().id]"
      class="text-xl font-bold text-white hover:underline">

      {{ course().title }}

    </a>

    ({{ course().code }})
  </h3>


  <p>
    Enrolled
    {{ course().enrollmentCount }}
    of
    {{ course().maxCapacity }} seats
  </p>


  <span
    class="badge"
    [class.closed]="course().enrollmentCount >= course().maxCapacity">

    {{
      course().enrollmentCount >= course().maxCapacity
        ? 'Full'
        : 'Accepting enrollments'
    }}

  </span>


  <button
    (click)="enroll()"
    [disabled]="course().enrollmentCount >= course().maxCapacity">

    {{
      course().enrollmentCount >= course().maxCapacity
        ? 'Full'
        : 'Enroll'
    }}

  </button>

</div>
